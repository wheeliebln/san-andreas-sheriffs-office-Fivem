<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Andreas Sheriff's Office</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222;
        }

        /* Navigation */
        nav {
            background-color: #17243a;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        /* Hero section */
        .hero {
            height: 500px;
            background-color: #777;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        .hero-content {
            max-width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hero img {
            max-width: 90%;
            max-height: 400px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .hero p {
            font-size: 20px;
            margin: 15px 0 0 0;
        }

        /* Main Content */
        .content {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            color: #17243a;
        }

        /* Expandable Division Bars */
        details {
            background-color: #17243a;
            color: white;
            margin-bottom: 12px;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        details[open] {
            background-color: #1e2f4a;
        }

        summary {
            padding: 18px 22px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        /* Remove default arrow */
        summary::-webkit-details-marker {
            display: none;
        }

        /* Custom arrow */
        summary::after {
            content: "+";
            font-size: 22px;
            font-weight: normal;
            transition: transform 0.2s ease;
        }

        details[open] summary::after {
            content: "−";
        }

        .details-content {
            padding: 0 22px 20px 22px;
            font-size: 15px;
            line-height: 1.6;
            color: #e0e0e0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        summary:hover {
            background-color: #1e2f4a;
        }
    </style>
</head>
<body>

    <nav>

            <p>San Andreas Sheriff's Office</p>
        </div>
    </section>

    <!-- Expandable Divisions -->

</body>
